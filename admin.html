
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração | Mural Escolar Oficial</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#102e64;color:white;padding:22px;text-align:center}
main{max-width:750px;margin:30px auto;padding:20px}
.card{background:white;padding:24px;border-radius:16px;box-shadow:0 5px 20px #0001;margin-bottom:20px}
h2{margin-top:0}
label{display:block;margin-top:15px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;margin-top:7px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
textarea{min-height:120px;resize:vertical}
button{border:0;border-radius:8px;padding:12px 18px;background:#2459a9;color:white;font-weight:bold;cursor:pointer;margin-top:16px}
button:hover{background:#183f80}
#status{white-space:pre-wrap;margin-top:15px}
.aviso{border:1px solid #dbe5f2;padding:15px;border-radius:10px;margin-top:12px}
.pequeno{color:#64748b;font-size:14px}
</style>
</head>
<body>
<header>
<h1>Mural Escolar Oficial</h1>
<p>Painel administrativo da direção</p>
</header>

<main>
<section class="card" id="login">
<h2>Entrar na administração</h2>
<form id="loginForm">
<label for="email">E-mail da direção</label>
<input id="email" type="email" autocomplete="username" required>

<label for="senha">Senha</label>
<input id="senha" type="password" autocomplete="current-password" required>

<button type="submit">Entrar</button>
</form>
<p id="loginStatus" role="status"></p>
</section>

<section class="card" id="painel" hidden>
<h2>Publicar aviso</h2>
<p class="pequeno">Os avisos publicados poderão aparecer no mural dos alunos.</p>

<form id="avisoForm">
<label for="titulo">Título do aviso</label>
<input id="titulo" maxlength="120" required>

<label for="categoria">Categoria</label>
<select id="categoria" required>
<option value="Direção">Direção</option>
<option value="Provas">Provas</option>
<option value="Eventos">Eventos</option>
<option value="Horários">Horários</option>
<option value="Cardápio">Cardápio</option>
<option value="Urgente">Urgente</option>
</select>

<label for="descricao">Descrição</label>
<textarea id="descricao" maxlength="5000" required></textarea>

<label for="dataAviso">Data do aviso</label>
<input id="dataAviso" type="date" required>

<button type="submit">Publicar aviso</button>
</form>

<p id="status" role="status"></p>

<hr>
<h2>Avisos publicados</h2>
<div id="listaAvisos">Carregando avisos...</div>

<button id="sair" type="button">Sair da administração</button>
</section>
</main>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

import {
  getFirestore, collection, addDoc, query, where, orderBy, getDocs,
  serverTimestamp, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBe70DeHBd2OawVV4kXQvgQl3FZSc4xY",
  authDomain: "mural-escolar-oficial.firebaseapp.com",
  projectId: "mural-escolar-oficial",
  storageBucket: "mural-escolar-oficial.firebasestorage.app",
  messagingSenderId: "706068384737",
  appId: "1:706068384737:web:d5736bf4d89a3c1e09e0a0",
  measurementId: "G-5V2L9FCN0M"
};

const ADMIN_UID = "w3s8trwqH0W4ZJRyCSF9HTGRVG43";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const login = document.getElementById("login");
const painel = document.getElementById("painel");
const loginStatus = document.getElementById("loginStatus");
const status = document.getElementById("status");
const lista = document.getElementById("listaAvisos");

document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  loginStatus.textContent = "Entrando...";
  try {
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value.trim(),
      document.getElementById("senha").value
    );
  } catch (error) {
    loginStatus.textContent = "Não foi possível entrar. Confira o e-mail e a senha.";
  }
});

onAuthStateChanged(auth, async user => {
  if (!user) {
    login.hidden = false;
    painel.hidden = true;
    return;
  }

  if (user.uid !== ADMIN_UID) {
    await signOut(auth);
    loginStatus.textContent = "Esta conta não tem autorização para administrar o mural.";
    return;
  }

  login.hidden = true;
  painel.hidden = false;
  await carregarAvisos();
});

document.getElementById("avisoForm").addEventListener("submit", async e => {
  e.preventDefault();
  const user = auth.currentUser;

  if (!user || user.uid !== ADMIN_UID) {
    status.textContent = "Acesso não autorizado.";
    return;
  }

  status.textContent = "Publicando aviso...";

  try {
    await addDoc(collection(db, "avisos"), {
      titulo: document.getElementById("titulo").value.trim(),
      categoria: document.getElementById("categoria").value,
      descricao: document.getElementById("descricao").value.trim(),
      dataAviso: document.getElementById("dataAviso").value,
      publicado: true,
      createdAt: serverTimestamp(),
      autorUid: user.uid
    });

    status.textContent = "Aviso publicado com sucesso!";
    e.target.reset();
    await carregarAvisos();
  } catch (error) {
    console.error(error);
    status.textContent = "Erro ao publicar. Confira as regras do Firestore.";
  }
});

async function carregarAvisos() {
  lista.textContent = "Carregando...";
  try {
    const q = query(
      collection(db, "avisos"),
      where("publicado", "==", true),
      orderBy("dataAviso", "desc")
    );
    const resultado = await getDocs(q);
    lista.replaceChildren();

    if (resultado.empty) {
      lista.textContent = "Nenhum aviso publicado ainda.";
      return;
    }

    resultado.forEach(item => {
      const a = item.data();
      const caixa = document.createElement("article");
      caixa.className = "aviso";

      const titulo = document.createElement("h3");
      titulo.textContent = a.titulo || "Aviso";

      const categoria = document.createElement("p");
      categoria.textContent = "Categoria: " + (a.categoria || "Geral");

      const descricao = document.createElement("p");
      descricao.textContent = a.descricao || "";

      const data = document.createElement("p");
      data.className = "pequeno";
      data.textContent = "Data: " + (a.dataAviso || "Não informada");

      const apagar = document.createElement("button");
      apagar.type = "button";
      apagar.textContent = "Excluir aviso";
      apagar.addEventListener("click", async () => {
        if (!confirm("Deseja excluir este aviso?")) return;
        try {
          await deleteDoc(doc(db, "avisos", item.id));
          await carregarAvisos();
        } catch (error) {
          status.textContent = "Não foi possível excluir o aviso.";
        }
      });

      caixa.append(titulo, categoria, descricao, data, apagar);
      lista.append(caixa);
    });
  } catch (error) {
    console.error(error);
    lista.textContent = "Não foi possível carregar os avisos. Verifique as regras e o índice do Firestore.";
  }
}

document.getElementById("sair").addEventListener("click", async () => {
  await signOut(auth);
});
</script>
</body>
</html>
