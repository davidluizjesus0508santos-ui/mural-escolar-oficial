
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADM | Mural Escolar Oficial</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #fff;
    }
    main { max-width: 700px; margin: 0 auto; }
    section {
      background: #172033;
      padding: 22px;
      margin: 18px 0;
      border-radius: 14px;
    }
    h1, h2 { color: #fff; }
    input, textarea, button {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input, textarea {
      background: #fff;
      color: #111;
      border: 1px solid #ccc;
    }
    button {
      border: 0;
      background: #2463eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .secondary { background: #374151; }
    .notice {
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #46536b;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>Painel Administrativo</h1>
  <p>Mural Escolar Oficial</p>

  <section id="loginSection">
    <h2>Entrar</h2>
    <input id="email" type="email" placeholder="E-mail do administrador">
    <input id="password" type="password" placeholder="Senha" autocomplete="current-password">
    <button id="loginBtn">Entrar no painel</button>
  </section>

  <p id="status" role="status">Configure o Firebase para começar.</p>

  <section id="adminSection" hidden>
    <h2>Publicar aviso</h2>
    <input id="title" placeholder="Título do aviso">
    <textarea id="content" rows="5" placeholder="Escreva o aviso"></textarea>
    <button id="publishBtn">Publicar aviso</button>
    <button id="logoutBtn" class="secondary">Sair</button>
  </section>

  <section id="noticesSection" hidden>
    <h2>Avisos publicados</h2>
    <div id="notices"></div>
  </section>
</main>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, getDocs,
    query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ID informado pelo usuário. Não substitui a configuração completa.
  const meuId = "w3s8trwqH0W4ZJRyCSF9HTGRVG43";

  // Preencha com os valores de Configuração do SDK no Firebase Console.
  const firebaseConfig = {
    apiKey: "COLE_SUA_API_KEY",
    authDomain: "COLE_SEU_AUTH_DOMAIN",
    projectId: "COLE_SEU_PROJECT_ID",
    storageBucket: "COLE_SEU_STORAGE_BUCKET",
    messagingSenderId: "COLE_SEU_MESSAGING_SENDER_ID",
    appId: "COLE_SEU_APP_ID"
  };

  const status = document.getElementById("status");
  const loginSection = document.getElementById("loginSection");
  const adminSection = document.getElementById("adminSection");
  const noticesSection = document.getElementById("noticesSection");

  const configIncomplete = Object.values(firebaseConfig).some(
    value => value.startsWith("COLE_") || !value
  );

  if (configIncomplete) {
    status.textContent =
      "Configure o Firebase no código antes de entrar. ID informado: " + meuId;
  } else {
    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      document.getElementById("loginBtn").onclick = async () => {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
          await signInWithEmailAndPassword(auth, email, password);
          status.textContent = "Login realizado.";
        } catch (error) {
          status.textContent = "Erro no login: " + error.code;
        }
      };

      document.getElementById("logoutBtn").onclick = () => signOut(auth);

      onAuthStateChanged(auth, async user => {
        loginSection.hidden = !!user;
        adminSection.hidden = !user;
        noticesSection.hidden = !user;

        if (user) {
          status.textContent = "Conectado: " + user.email;
          await loadNotices();
        } else {
          status.textContent = "Entre com sua conta autorizada.";
        }
      });

      document.getElementById("publishBtn").onclick = async () => {
        const title = document.getElementById("title").value.trim();
        const content = document.getElementById("content").value.trim();

        if (!title || !content) {
          status.textContent = "Preencha o título e o conteúdo.";
          return;
        }

        try {
          await addDoc(collection(db, "avisos"), {
            title,
            content,
            createdAt: serverTimestamp(),
            author: auth.currentUser.email
          });
          document.getElementById("title").value = "";
          document.getElementById("content").value = "";
          status.textContent = "Aviso publicado.";
          await loadNotices();
        } catch (error) {
          status.textContent = "Erro ao publicar: " + error.code;
        }
      };

      async function loadNotices() {
        const container = document.getElementById("notices");
        container.replaceChildren();

        try {
          const q = query(
            collection(db, "avisos"),
            orderBy("createdAt", "desc")
          );
          const snapshot = await getDocs(q);

          snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const card = document.createElement("article");
            card.className = "notice";

            const heading = document.createElement("h3");
            heading.textContent = data.title || "Aviso";
            const paragraph = document.createElement("p");
            paragraph.textContent = data.content || "";

            card.append(heading, paragraph);
            container.appendChild(card);
          });

          if (snapshot.empty) {
            container.textContent = "Nenhum aviso publicado ainda.";
          }
        } catch (error) {
          status.textContent = "Erro ao carregar avisos: " + error.code;
        }
      }
    } catch (error) {
      status.textContent = "Erro ao iniciar Firebase: " + error.message;
    }
  }
</script>
</body>
</html>
