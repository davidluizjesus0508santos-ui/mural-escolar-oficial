
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADM | Mural Escolar Oficial</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    header {
      background: #12336b;
      color: white;
      padding: 22px;
      text-align: center;
    }
    main { max-width: 800px; margin: 30px auto; padding: 0 16px; }
    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px #0f172a10;
    }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      margin-top: 16px;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #174b91;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .back { color: #174b91; }
    .note { color: #64748b; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1>🔐 Área Administrativa</h1>
    <p>Mural Escolar Oficial</p>
  </header>

  <main>
    <div class="card">
      <h2>📢 Cadastro de avisos</h2>
      <p>Este formulário é apenas o visual inicial. Ainda não publica avisos no mural.</p>

      <form id="formAviso">
        <label for="titulo">Título do aviso</label>
        <input id="titulo" required maxlength="150"
               placeholder="Ex.: Reunião de pais">

        <label for="categoria">Categoria</label>
        <select id="categoria">
          <option>Direção</option>
          <option>Provas</option>
          <option>Eventos</option>
          <option>Horários</option>
          <option>Cardápio</option>
          <option>Urgente</option>
        </select>

        <label for="descricao">Mensagem</label>
        <textarea id="descricao" required maxlength="5000"
                  placeholder="Escreva o comunicado..."></textarea>

        <label for="validade">Data do aviso (opcional)</label>
        <input id="validade" type="date">

        <button type="submit">Preparar aviso</button>
      </form>
      <p id="resultado" role="status"></p>
      <p class="note">
        Para uso oficial, precisamos adicionar login seguro e conectar o
        formulário a um banco de dados antes de publicar avisos reais.
      </p>
    </div>

    <p><a class="back" href="index.html">← Voltar ao mural</a></p>
  </main>

  <script>
    document.getElementById("formAviso").addEventListener("submit", function(event) {
      event.preventDefault();

      const titulo = document.getElementById("titulo").value.trim();
      const descricao = document.getElementById("descricao").value.trim();

      if (!titulo || !descricao) return;

      document.getElementById("resultado").textContent =
        "Aviso preparado! Ele ainda não foi publicado no mural.";

      this.reset();
    });
  </script>
</body>
</html>
