
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADM | Mural Escolar Oficial</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #080d18;
      color: #ffffff;
    }

    .container {
      max-width: 750px;
      margin: 30px auto;
    }

    h1, h2 {
      color: #ffffff;
    }

    .subtitulo {
      color: #aab7cc;
    }

    .card {
      background: #111c30;
      border: 1px solid #263957;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
    }

    input, textarea {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 13px;
      border: 1px solid #40516d;
      border-radius: 7px;
      background: #080d18;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 12px 17px;
      margin: 5px 5px 5px 0;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .principal {
      background: #1769e0;
      color: white;
    }

    .perigo {
      background: #b42332;
      color: white;
    }

    .secundario {
      background: #263957;
      color: white;
    }

    .aviso {
      border: 1px solid #30415e;
      border-radius: 8px;
      padding: 15px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .aviso p {
      white-space: pre-wrap;
    }

    #mensagem {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #ffd166;
    }

    .oculto {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>ADM | Mural Escolar Oficial</h1>
    <p class="subtitulo">Painel de administração da escola</p>

    <section class="card" id="painelLogin">
      <h2>Entrar na administração</h2>

      <form id="formLogin">
        <input
          type="email"
          id="email"
          placeholder="E-mail do administrador"
          autocomplete="username"
          required
        >

        <input
          type="password"
          id="senha"
          placeholder="Senha"
          autocomplete="current-password"
          required
        >

        <button class="principal" id="botaoEntrar" type="submit">
          Entrar
        </button>
      </form>

      <p id="mensagem" role="status"></p>
    </section>

    <section class="card oculto" id="painelAdmin">
      <h2>Publicar aviso</h2>

      <form id="formAviso">
        <input
          type="text"
          id="titulo"
          placeholder="Título do aviso"
          maxlength="120"
          required
        >

        <textarea
          id="conteudo"
          placeholder="Escreva o aviso da escola"
          maxlength="5000"
          required
        ></textarea>

        <button class="principal" id="botaoPublicar" type="submit">
          Publicar aviso
        </button>
      </form>

      <p id="mensagemAviso" role="status"></p>

      <hr>

      <h2>Avisos publicados</h2>
      <div id="listaAvisos">Carregando avisos...</div>

      <button class="secundario" id="botaoSair" type="button">
        Sair da administração
      </button>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      doc,
      query,
      orderBy,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBe70DeHBd2OawVVk4xVQgjQql3FZSc4xY",
      authDomain: "mural-escolar-oficial.firebaseapp.com",
      projectId: "mural-escolar-oficial",
      storageBucket: "mural-escolar-oficial.firebasestorage.app",
      messagingSenderId: "706068384737",
      appId: "1:706068384737:web:d5736bf4d89a3c1e09e0a0",
      measurementId: "G-5V2L9FCN0M"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const painelLogin = document.getElementById("painelLogin");
    const painelAdmin = document.getElementById("painelAdmin");
    const formLogin = document.getElementById("formLogin");
    const formAviso = document.getElementById("formAviso");
    const mensagem = document.getElementById("mensagem");
    const mensagemAviso = document.getElementById("mensagemAviso");
    const botaoEntrar = document.getElementById("botaoEntrar");
    const botaoPublicar = document.getElementById("botaoPublicar");
    const listaAvisos = document.getElementById("listaAvisos");

    function explicarErro(erro) {
      const erros = {
        "auth/api-key-not-valid":
          "A chave de API foi rejeitada. Confira a chave nas configurações do Firebase.",
        "auth/invalid-credential":
          "E-mail ou senha incorretos.",
        "auth/invalid-email":
          "O formato do e-mail é inválido.",
        "auth/user-not-found":
          "Esse usuário não foi encontrado no Firebase Authentication.",
        "auth/wrong-password":
          "Senha incorreta.",
        "auth/too-many-requests":
          "Muitas tentativas. Aguarde um pouco e tente novamente.",
        "auth/network-request-failed":
          "Falha de conexão. Confira sua internet.",
        "auth/operation-not-allowed":
          "Ative o método E-mail/senha em Authentication no Firebase."
      };

      return erros[erro.code] ||
        "Erro: " + (erro.code || erro.message || "desconhecido");
    }

    formLogin.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      mensagem.textContent = "Verificando acesso...";
      botaoEntrar.disabled = true;

      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("senha").value
        );

        mensagem.textContent = "Login realizado.";
      } catch (erro) {
        mensagem.textContent = explicarErro(erro);
      } finally {
        botaoEntrar.disabled = false;
      }
    });

    onAuthStateChanged(auth, async (usuario) => {
      if (usuario) {
        painelLogin.classList.add("oculto");
        painelAdmin.classList.remove("oculto");
        await carregarAvisos();
      } else {
        painelAdmin.classList.add("oculto");
        painelLogin.classList.remove("oculto");
        listaAvisos.textContent = "";
      }
    });

    formAviso.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      botaoPublicar.disabled = true;
      mensagemAviso.textContent = "Publicando...";

      try {
        const titulo = document.getElementById("titulo").value.trim();
        const conteudo = document.getElementById("conteudo").value.trim();

        if (!titulo || !conteudo) {
          mensagemAviso.textContent = "Preencha o título e o aviso.";
          return;
        }

        await addDoc(collection(db, "avisos"), {
          titulo,
          conteudo,
          criadoEm: serverTimestamp(),
          autor: auth.currentUser.uid
        });

        formAviso.reset();
        mensagemAviso.textContent = "Aviso publicado com sucesso.";
        await carregarAvisos();
      } catch (erro) {
        mensagemAviso.textContent = explicarErro(erro);
      } finally {
        botaoPublicar.disabled = false;
      }
    });

    async function carregarAvisos() {
      listaAvisos.textContent = "Carregando avisos...";

      try {
        const consulta = query(
          collection(db, "avisos"),
          orderBy("criadoEm", "desc")
        );

        const resultado = await getDocs(consulta);
        listaAvisos.replaceChildren();

        if (resultado.empty) {
          listaAvisos.textContent = "Nenhum aviso publicado.";
          return;
        }

        resultado.forEach((registro) => {
          const dados = registro.data();

          const artigo = document.createElement("article");
          artigo.className = "aviso";

          const titulo = document.createElement("h3");
          titulo.textContent = dados.titulo || "Aviso sem título";

          const conteudo = document.createElement("p");
          conteudo.textContent = dados.conteudo || "";

          const excluir = document.createElement("button");
          excluir.className = "perigo";
          excluir.type = "button";
          excluir.textContent = "Excluir aviso";

          excluir.addEventListener("click", async () => {
            if (!confirm("Tem certeza de que deseja excluir este aviso?")) {
              return;
            }

            excluir.disabled = true;

            try {
              await deleteDoc(doc(db, "avisos", registro.id));
              await carregarAvisos();
            } catch (erro) {
              mensagemAviso.textContent = explicarErro(erro);
              excluir.disabled = false;
            }
          });

          artigo.append(titulo, conteudo, excluir);
          listaAvisos.appendChild(artigo);
        });
      } catch (erro) {
        listaAvisos.textContent = explicarErro(erro);
      }
    }

    document.getElementById("botaoSair").addEventListener("click", async () => {
      try {
        await signOut(auth);
        mensagem.textContent = "Você saiu da administração.";
      } catch (erro) {
        mensagem.textContent = explicarErro(erro);
      }
    });
  </script>
</body>
</html>
