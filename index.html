
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mural Escolar Oficial</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#102e64;color:white;padding:30px 18px;text-align:center}
header h1{margin:0 0 8px}
nav{background:white;padding:14px;text-align:center;box-shadow:0 2px 8px #0001}
nav a{color:#174b91;text-decoration:none;font-weight:bold}
main{max-width:900px;margin:25px auto;padding:0 16px}
.intro{background:white;border-radius:14px;padding:20px;margin-bottom:20px}
h2{color:#173b70}
#busca{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;margin-bottom:15px}
#filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
#filtros button{padding:9px 12px;border:0;border-radius:20px;background:#dbeafe;color:#173b70;cursor:pointer}
#filtros button.ativo{background:#174b91;color:white}
.aviso{background:white;padding:20px;border-radius:13px;margin-bottom:15px;border-left:5px solid #2459a9;box-shadow:0 3px 12px #0000000b}
.aviso h3{margin:0 0 10px;color:#173b70}
.tag{display:inline-block;background:#e0eaff;color:#173b70;padding:5px 9px;border-radius:20px;font-size:13px}
.data{font-size:13px;color:#64748b}
#mensagem{padding:18px;background:white;border-radius:12px}
footer{text-align:center;padding:25px;color:#64748b;font-size:14px}
</style>
</head>
<body>
<header>
<h1>📢 Mural Escolar Oficial</h1>
<p>Informações, comunicados e novidades da escola</p>
</header>

<nav><a href="#avisos">Avisos oficiais</a></nav>

<main>
<section class="intro">
<h2>Fique por dentro!</h2>
<p>Consulte aqui os comunicados publicados pela direção da escola.</p>
<input id="busca" type="search" placeholder="Buscar um aviso...">
<div id="filtros">
<button class="ativo" data-categoria="Todos">Todos</button>
<button data-categoria="Direção">Direção</button>
<button data-categoria="Provas">Provas</button>
<button data-categoria="Eventos">Eventos</button>
<button data-categoria="Horários">Horários</button>
<button data-categoria="Cardápio">Cardápio</button>
<button data-categoria="Urgente">Urgente</button>
</div>
</section>

<section id="avisos">
<h2>Últimos avisos</h2>
<div id="lista"><p id="mensagem">Carregando avisos oficiais...</p></div>
</section>
</main>

<footer>Mural Escolar Oficial · Consulte os avisos da sua escola</footer>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {
  getFirestore, collection, query, where, orderBy, getDocs
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBe70DeHBd2OawVV4kXQqVQgjQql3FZSc4xY",
  authDomain: "mural-escolar-oficial.firebaseapp.com",
  projectId: "mural-escolar-oficial",
  storageBucket: "mural-escolar-oficial.firebasestorage.app",
  messagingSenderId: "706068384737",
  appId: "1:706068384737:web:d5736bf4d89a3c1e09e0a0",
  measurementId: "G-5V2L9FCN0M"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const lista = document.getElementById("lista");
const busca = document.getElementById("busca");
let avisos = [];
let categoriaAtual = "Todos";

function mostrarAvisos(){
  const termo = busca.value.trim().toLowerCase();
  const filtrados = avisos.filter(a => {
    const texto = `${a.titulo || ""} ${a.descricao || ""} ${a.categoria || ""}`.toLowerCase();
    return (categoriaAtual === "Todos" || a.categoria === categoriaAtual)
      && texto.includes(termo);
  });

  lista.replaceChildren();

  if (!filtrados.length) {
    const p = document.createElement("p");
    p.id = "mensagem";
    p.textContent = avisos.length
      ? "Nenhum aviso encontrado nessa busca."
      : "Ainda não há avisos publicados.";
    lista.append(p);
    return;
  }

  filtrados.forEach(a => {
    const artigo = document.createElement("article");
    artigo.className = "aviso";

    const titulo = document.createElement("h3");
    titulo.textContent = a.titulo || "Aviso escolar";

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = a.categoria || "Geral";

    const descricao = document.createElement("p");
    descricao.textContent = a.descricao || "";

    const data = document.createElement("p");
    data.className = "data";
    data.textContent = "Data: " + (a.dataAviso || "Não informada");

    artigo.append(titulo, tag, descricao, data);
    lista.append(artigo);
  });
}

document.getElementById("filtros").querySelectorAll("button").forEach(botao => {
  botao.addEventListener("click", () => {
    categoriaAtual = botao.dataset.categoria;
    document.querySelectorAll("#filtros button").forEach(b => b.classList.remove("ativo"));
    botao.classList.add("ativo");
    mostrarAvisos();
  });
});

busca.addEventListener("input", mostrarAvisos);

async function carregarAvisos(){
  try {
    const q = query(
      collection(db, "avisos"),
      where("publicado", "==", true),
      orderBy("dataAviso", "desc")
    );
    const resultado = await getDocs(q);
    avisos = resultado.docs.map(d => d.data());
    mostrarAvisos();
  } catch (error) {
    console.error(error);
    lista.replaceChildren();
    const p = document.createElement("p");
    p.id = "mensagem";
    p.textContent = "Não foi possível carregar os avisos. Tente novamente mais tarde.";
    lista.append(p);
  }
}

carregarAvisos();
</script>
</body>
</html>
